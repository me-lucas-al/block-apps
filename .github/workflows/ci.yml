name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:no-any
      - run: pnpm typecheck
      - run: pnpm test
      - name: Package backend Lambda
        run: pnpm --filter @block-apps/backend package
      - name: Build extension
        run: pnpm --filter @block-apps/extension build
        env:
          VITE_API_URL: https://api.ci.invalid
          VITE_COGNITO_USER_POOL_ID: ci-region_ciPool
          VITE_COGNITO_CLIENT_ID: ci-extension-client
          VITE_COGNITO_HOSTED_DOMAIN: auth.ci.invalid
      - name: Build admin site
        run: pnpm --filter @block-apps/admin build
        env:
          VITE_API_URL: https://api.ci.invalid
          VITE_COGNITO_USER_POOL_ID: ci-region_ciPool
          VITE_COGNITO_CLIENT_ID: ci-admin-client
          VITE_COGNITO_HOSTED_DOMAIN: auth.ci.invalid

  android:
    name: Android native module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Run Kotlin unit tests
        run: ./gradlew :app-blocker:testDebugUnitTest --no-daemon
        working-directory: apps/mobile/android

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: terraform fmt -check -recursive infra/
      - name: Package Lambda for validation
        run: pnpm --filter @block-apps/backend package
      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap init -backend=false && terraform -chdir=infra/bootstrap validate
      - name: Validate dev environment
        run: terraform -chdir=infra/environments/dev init -backend=false && terraform -chdir=infra/environments/dev validate
