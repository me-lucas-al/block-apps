name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:no-any
      - run: pnpm typecheck
      - run: pnpm test
      - name: Package backend Lambda
        run: pnpm --filter @block-apps/backend package
      - name: Build extension
        run: pnpm --filter @block-apps/extension build
      - name: Build Firefox extension
        run: pnpm --filter @block-apps/extension build:firefox
      - name: Build admin site
        run: pnpm --filter @block-apps/admin build

  android:
    name: Android native module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Run Kotlin unit tests
        run: ./gradlew :app-blocker:testDebugUnitTest --no-daemon
        working-directory: apps/mobile/android

  terraform:
    name: Terraform format, lint, security and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.66.0
          cache: true
          tflint_config_path: infra/.tflint.hcl
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: terraform fmt -check -recursive infra/
      - name: Lint Terraform with TFLint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init && tflint --recursive
      - name: Scan Terraform security with Trivy
        run: trivy config --ignorefile infra/.trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 infra/
      - name: Package Lambda for validation
        run: pnpm --filter @block-apps/backend package
      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap init -backend=false && terraform -chdir=infra/bootstrap validate
      - name: Validate dev environment
        run: terraform -chdir=infra/environments/dev init -backend=false && terraform -chdir=infra/environments/dev validate
