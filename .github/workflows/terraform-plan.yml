name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'packages/backend/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'me-lucas-al/block-apps'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package Lambda
        run: pnpm --filter @block-apps/backend package
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0
      - name: Check AWS credentials available
        id: check-creds
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "has_role=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_role=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials
        if: steps.check-creds.outputs.has_role == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1
      - name: Terraform plan
        if: steps.check-creds.outputs.has_role == 'true'
        run: |
          terraform -chdir=infra/environments/dev init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=sa-east-1" \
            -backend-config="key=block-apps/dev/terraform.tfstate" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/environments/dev plan -no-color
