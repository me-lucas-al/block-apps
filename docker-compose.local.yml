name: block-apps-local

services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.1.3
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - dynamodb

  api:
    build:
      context: .
      dockerfile: docker/local-api/Dockerfile
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      HOST: 0.0.0.0
      LOCAL_API_ALLOW_REMOTE_HOST: "true"
      PORT: "3000"
      MAX_RULES_PER_USER: "${MAX_RULES_PER_USER:-200}"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - dynamodb
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
