name: block-apps-local

services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  api:
    build:
      context: .
      dockerfile: docker/local-api/Dockerfile
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - dynamodb
