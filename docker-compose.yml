services:
  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID:?set VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:?set VITE_COGNITO_CLIENT_ID}
        VITE_COGNITO_HOSTED_DOMAIN: ${VITE_COGNITO_HOSTED_DOMAIN:?set VITE_COGNITO_HOSTED_DOMAIN}
    environment:
      API_URL: ${VITE_API_URL:?set VITE_API_URL}
      COGNITO_HOSTED_DOMAIN: ${VITE_COGNITO_HOSTED_DOMAIN:?set VITE_COGNITO_HOSTED_DOMAIN}
      AWS_REGION: ${AWS_REGION:-sa-east-1}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
