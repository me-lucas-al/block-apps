services:
  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://i51vicajy2.execute-api.sa-east-1.amazonaws.com}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID:-sa-east-1_Xs9lFCHn5}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-6r3dn6koip7gfpf4iu06ai3d47}
        VITE_COGNITO_HOSTED_DOMAIN: ${VITE_COGNITO_HOSTED_DOMAIN:-block-apps-auth-090082365159.auth.sa-east-1.amazoncognito.com}
    environment:
      API_URL: ${VITE_API_URL:-https://i51vicajy2.execute-api.sa-east-1.amazonaws.com}
      COGNITO_HOSTED_DOMAIN: ${VITE_COGNITO_HOSTED_DOMAIN:-block-apps-auth-090082365159.auth.sa-east-1.amazoncognito.com}
